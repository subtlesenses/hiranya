name: Website security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-security-build:
    name: Website security and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked website dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Audit website dependencies
        run: npm audit --audit-level=moderate
      - name: Test content security boundaries
        run: npm run test:security
      - name: Build the production website
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
